name: Build

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: 'CEF version'
        required: true
        default: '150.0.11'
      commit_hash:
        description: 'CEF commit hash (with g prefix)'
        required: true
        default: 'gb887805'
      chromium_version:
        description: 'Chromium version'
        required: true
        default: '150.0.7871.115'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [linux64, linuxarm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-strip
        if: matrix.arch == 'linuxarm64'
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Run make_cefredist.sh
        run: |
          # Override the hardcoded URL with our inputs
          export CEF_URL="https://cef-builds.spotifycdn.com/cef_binary_${{ inputs.cef_version }}%2B${{ inputs.commit_hash }}%2Bchromium-${{ inputs.chromium_version }}_${{ matrix.arch }}_minimal.tar.bz2"

          rm -rf tmp-${{ matrix.arch }}
          mkdir tmp-${{ matrix.arch }}
          cd tmp-${{ matrix.arch }}

          mkdir -p ../package-${{ matrix.arch }}/CEF

          curl -L -o cef.tar.bz2 "$CEF_URL"
          mkdir cef_binaries
          tar -xjf cef.tar.bz2 -C cef_binaries

          RELEASE_DIR=$(find cef_binaries -type d -name "Release" | head -1)
          cp -a "$RELEASE_DIR"/. ../package-${{ matrix.arch }}/CEF/

          RESOURCES_DIR=$(find cef_binaries -type d -name "Resources" | head -1)
          cp -a "$RESOURCES_DIR"/. ../package-${{ matrix.arch }}/CEF/

          cd ..
          STRIP="strip"
          [ "${{ matrix.arch }}" = "linuxarm64" ] && STRIP="aarch64-linux-gnu-strip"
          for so in package-${{ matrix.arch }}/CEF/*.so; do
            [ -f "$so" ] && [ ! -L "$so" ] && $STRIP -s "$so" || true
          done

      - name: Extract API hash (linux64)
        if: matrix.arch == 'linux64'
        run: |
          python3 -c "
          import ctypes
          lib = ctypes.CDLL('package-${{ matrix.arch }}/CEF/libcef.so')
          lib.cef_api_hash.argtypes = [ctypes.c_int, ctypes.c_int]
          lib.cef_api_hash.restype = ctypes.c_char_p
          h = lib.cef_api_hash(15000, 0)
          print(f'CEF_API_HASH_PLATFORM_LINUX={h.decode()}')
          with open('linux_hash.txt', 'w') as f: f.write(h.decode())
          "

      - name: Create NuGet package
        run: |
          mkdir -p pkg/CEF
          cp -r package-${{ matrix.arch }}/CEF/* pkg/CEF/
          cp build/cef.redist.${{ matrix.arch }}.props pkg/
          cp LICENSE.txt pkg/

          cat > pkg/cef.redist.${{ matrix.arch }}.csproj << CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <PackageId>cef.redist.${{ matrix.arch }}</PackageId>
              <Version>${{ inputs.cef_version }}</Version>
              <Authors>The Chromium Embedded Framework Authors</Authors>
              <Description>CEF - the Chromium Embedded Framework.</Description>
              <Copyright>Copyright © 2025</Copyright>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoDefaultExcludes>true</NoDefaultExcludes>
              <NoWarn>NU5100;NU5104;NU5118</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <None Include="cef.redist.${{ matrix.arch }}.props" Pack="true" PackagePath="build/" />
              <None Include="LICENSE.txt" Pack="true" PackagePath="" />
              <Content Include="CEF\**\*" Pack="true" PackagePath="CEF\%(RecursiveDir)%(Filename)%(Extension)" />
            </ItemGroup>
          </Project>
          CSPROJ

          cd pkg
          dotnet pack -c Release --output ..

      - uses: actions/upload-artifact@v4
        with:
          name: cef.redist.${{ matrix.arch }}
          path: |
            ./*.nupkg
            linux_hash.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: find artifacts -name "*.nupkg" -exec ls -lh {} \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.cef_version }}
          name: "CEF Redist Linux ${{ inputs.cef_version }}"
          files: artifacts/**/*.nupkg
